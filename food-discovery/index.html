<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Discovery App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h2>Food Discovery App</h2>
      <button id="header-button">❤️Favorites</button>
    </header>

    <main>
      <form id="search-form">
        <input type="text" id="searchInput" placeholder="search..." />
        <button type="submit">Search</button>
      </form>
      <p id="message"></p>

      <section id="content">

      <section class="main-section">
        <h2>Main Data</h2>
        <div class="grid" id="main">
        </div>
      </section>

      <section class="favorite-section">
        <h2>Favorites</h2>

        <div class="grid" id="favorite">
        </div>
      </section>
    </section>

    </main>
    <script src="script.js"></script>
  </body>
</html>
